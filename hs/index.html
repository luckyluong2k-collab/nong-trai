<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đang mở sổ tay…</title><style>body{font-family:system-ui;background:#f3f6fa;color:#0b2e59;display:grid;place-items:center;min-height:100vh;margin:0}.box{padding:24px;text-align:center}.spin{width:34px;height:34px;border:4px solid #dbe3ed;border-top-color:#0f6fc6;border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spin"></div><b>Đang tải Sổ tay Hoa Sen Home Phủ Lý…</b><div id="msg" style="font-size:13px;margin-top:8px;color:#607086">Lần đầu có thể mất vài giây.</div></div><script>
(async()=>{
try{
let s='';for(let i=1;i<=10;i++){let n=String(i).padStart(2,'0');s+=await (await fetch('p'+n+'.txt')).text();}
let bin=atob(s),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
if(!('DecompressionStream'in window))throw new Error('Trình duyệt quá cũ');
let ds=new DecompressionStream('gzip');let html=await new Response(new Blob([a]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();
}catch(e){document.getElementById('msg').innerHTML='Không tải được: '+e.message+'<br>Hãy mở bằng Chrome/Edge mới.';}
})();
</script></body></html>
