<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#C8102E"><meta name="x-build" content="hsh-v5.1-pdf-ux"><title>HSH Phủ Lý · Project Control V5.1</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8fafc}#app{border:0;width:100%;height:100%;display:block}.toast{position:fixed;z-index:99999;left:50%;bottom:22px;transform:translate(-50%,20px);max-width:min(92vw,560px);padding:11px 14px;border-radius:11px;background:#0f172a;color:#fff;font:600 13px/1.45 system-ui;box-shadow:0 12px 35px #0005;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast b{color:#fbbf24}</style></head><body><iframe id="app" src="v5-core.html" title="Dashboard HSH Phủ Lý"></iframe><div id="toast" class="toast"></div><script>const app=document.getElementById('app'),toast=document.getElementById('toast');let tt;function say(s){toast.innerHTML=s;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),3500)}app.addEventListener('load',()=>{const d=app.contentDocument;if(!d)return;const hero=d.querySelector('[data-panel="draw"] .hero p');if(hero)hero.textContent='Bấm “Mở trang” để xem đúng trang PDF. Lần đầu của mỗi phiên, web sẽ tự mở hộp chọn PDF gốc; chọn xong sẽ nhảy thẳng đến trang cần xem, không còn popup lỗi.';const n=d.querySelector('[data-panel="draw"] .card .note');if(n)n.innerHTML='<b>Cách dùng nhanh:</b> chỉ cần chọn TKTC và KC Móng PS một lần sau khi mở web. File được đọc cục bộ trên thiết bị, không upload lên GitHub.';d.addEventListener('click',e=>{const b=e.target.closest('[data-doc]');if(!b)return;const key=b.dataset.doc;const input=d.querySelector(key==='tktc'?'#tktcFile':'#kcFile');if(!input||input.files.length)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();const label=key==='tktc'?'TKTC':'KC Móng PS';say('📄 Chọn file <b>'+label+'</b> một lần. Sau khi chọn, web sẽ tự mở trang '+b.dataset.page+'.');const resume=()=>{if(input.files&&input.files.length)setTimeout(()=>b.click(),80)};input.addEventListener('change',resume,{once:true});input.click()},true)});</script></body></html>
